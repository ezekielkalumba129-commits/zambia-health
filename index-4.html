<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zambia Health</title>
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#1976d2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#eef2f5;margin:0;padding:16px 16px 150px;color:#16232e}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:19px;margin:20px 0 8px}
input,select{width:100%;padding:12px;border:1px solid #c9d3db;border-radius:8px;font-size:16px;box-sizing:border-box;margin-bottom:10px;background:#fff}
.card{background:#fff;padding:14px 16px;border-radius:10px;margin-bottom:10px;border:1px solid #dde5ea}
.name{font-size:18px;font-weight:700}.info{color:#4b5d6b;font-size:14px;margin:3px 0}
.fee{margin:8px 0;color:#1b7a3d;font-weight:700}.warn{color:#b45309;font-weight:700;margin:6px 0}
button,.btn{display:block;background:#1976d2;color:#fff;border:0;padding:12px;border-radius:8px;font-size:16px;width:100%;margin-top:8px;text-align:center;text-decoration:none;box-sizing:border-box;cursor:pointer}
.g{background:#6b7c8a}.r{background:#c62828}.w{background:#1f9d55}
.row{display:flex;gap:8px}.row>*{flex:1}
.empty{text-align:center;color:#6b7c8a}
section{display:none}#form{display:none}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #dde5ea}
#nav button{flex:1;background:none;color:#4b5d6b;border-radius:0;margin:0;padding:14px 2px;font-size:13px}
#nav .on{color:#1976d2;font-weight:700;box-shadow:inset 0 3px #1976d2}
#sos{position:fixed;right:14px;bottom:70px;width:auto;margin:0;background:#c62828;border-radius:28px;padding:13px 18px;font-weight:700;z-index:10}
#sp2{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:20;padding:16px;overflow:auto}
#sb{background:#fff;border-radius:12px;padding:16px;margin-top:40px}
.call{background:#c62828;font-size:18px;padding:14px}
</style></head><body>

<button id="sos" onclick="sos()">🆘 Emergency</button>
<div id="sp2"><div id="sb">
<h2 style="margin-top:0">Emergency</h2>
<a class="btn call" href="tel:999">Emergency: 999</a>
<a class="btn call" href="tel:992">Ambulance: 992</a>
<a class="btn call" href="tel:991">Police: 991</a>
<a class="btn call" href="tel:993">Fire: 993</a>
<a class="btn" href="tel:112">Any mobile phone: 112</a>
<button class="g" onclick="sos()">Close</button>
</div></div>

<section id="t-docs">
<h1>Find a Doctor</h1>
<input id="q" autocomplete="off" placeholder="Search name, specialty or language">
<div class="row"><select id="sp"></select><select id="ct"></select></div>
<div id="form" class="card">
<div class="name" id="ft"></div>
<input id="pn" placeholder="Your name">
<input id="ph" type="tel" placeholder="Phone number">
<input id="dt" type="date">
<select id="tm"><option>09:00</option><option>10:00</option><option>11:00</option><option>14:00</option><option>15:00</option><option>16:00</option></select>
<select id="pm" onchange="mm()"><option>MTN MoMo</option><option>Airtel Money</option><option>Pay at clinic</option></select>
<input id="mo" type="tel" placeholder="Mobile money number">
<button id="cb" onclick="confirmB()"></button>
<button class="g" onclick="$('form').style.display='none'">Cancel</button>
</div>
<div id="dl"></div>
</section>

<section id="t-visits"><h1>My Visits</h1><div id="vl"></div></section>

<section id="t-rx"><h1>Pharmacy</h1>
<p class="info">Sample items and prices. Prescription medicines need a prescription.</p>
<div id="rl"></div><h2>Cart</h2><div id="cl"></div></section>

<section id="t-hosp"><h1>Hospitals &amp; Clinics</h1>
<select id="prov" onchange="showH()"><option value="">All provinces</option><option>Central</option><option>Copperbelt</option><option>Eastern</option><option>Luapula</option><option>Lusaka</option><option>Muchinga</option><option>Northern</option><option>North-Western</option><option>Southern</option><option>Western</option></select>
<input id="dist" autocomplete="off" placeholder="District or town (e.g. Kasama)">
<button onclick="near()">Search this place on Google Maps</button>
<div id="hl" style="margin-top:12px"></div></section>

<section id="t-req"><h1>Booking Requests</h1><div id="rq"></div></section>

<section id="t-me"><h1>Me</h1>
<input id="mn" placeholder="Your name"><input id="mp" type="tel" placeholder="Phone number">
<select id="role" onchange="roleUI()"><option value="patient">I am a patient</option><option value="doctor">I am a doctor (demo)</option></select>
<select id="did" onchange="$('mw').value=waMap[this.value]||''"></select>
<input id="mw" type="tel" placeholder="Your WhatsApp number (e.g. 0977123456)">
<button onclick="saveMe()">Save Profile</button>
<button class="r" onclick="clearAll()">Delete local data</button>
</section>

<div id="nav"></div>

<script>
const SUPABASE_URL = 'https://sgjcrqidxbkrdrfrwjsg.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let D = [];
let waMap=L('wa',{});
let cart=L('cart',{}),me=L('me',{name:'',phone:'',did:0,role:'patient'}),sel=0;
const today=()=>new Date().toISOString().slice(0,10);
const uniq=a=>[...new Set(a)];

const H=[
['University Teaching Hospital','Lusaka','Lusaka','Public'],['Levy Mwanawasa University Teaching Hospital','Lusaka','Lusaka','Public'],
['Ndola Teaching Hospital','Ndola','Copperbelt','Public'],['Kitwe Teaching Hospital','Kitwe','Copperbelt','Public'],
['Livingstone University Teaching Hospital','Livingstone','Southern','Public'],['Medcross Hospital','Lusaka','Lusaka','Private'],
['Royal Hospital','Lusaka','Lusaka','Private'],['Medland Health Services & Hospital','Lusaka','Lusaka','Private']
];
const CAP={'Central':'Kabwe','Copperbelt':'Ndola','Eastern':'Chipata','Luapula':'Mansa','Lusaka':'Lusaka','Muchinga':'Chinsali','Northern':'Kasama','North-Western':'Solwezi','Southern':'Choma','Western':'Mongu'};
const RX=[['Paracetamol 500mg (10 tablets)',12],['Oral rehydration salts (sachet)',8],['Antiseptic cream',35],['Plasters (box)',25],['Hand sanitiser',30],['Mosquito repellent',40],['Vitamin C (30 tablets)',60]];

async function init(){
  const { data, error } = await sb.from('doctors').select('*');
  if(!error && data && data.length) { D = data; }
  
  $('sp').innerHTML='<option value="">All specialties</option>'+uniq(D.map(d=>d.specialty)).map(x=>'<option>'+x+'</option>').join('');
  $('ct').innerHTML='<option value="">All cities</option>'+uniq(D.map(d=>d.city)).map(x=>'<option>'+x+'</option>').join('');
  $('did').innerHTML=D.map((d,i)=>'<option value="'+i+'">'+d.name+'</option>').join('');
  
  showD();
  nav();
  go(me.role=='doctor'?'req':'docs');
}

function nav(){
  const t=me.role=='doctor'?[['req','Requests'],['me','Me']]:[['docs','Doctors'],['visits','Visits'],['rx','Pharmacy'],['hosp','Hospitals'],['me','Me']];
  $('nav').innerHTML=t.map(x=>'<button id="n-'+x[0]+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');
}

function go(t){
  ['docs','visits','rx','hosp','req','me'].forEach(x=>{$('t-'+x).style.display=x==t?'block':'none';if($('n-'+x))$('n-'+x).className=x==t?'on':''});
  if(t=='docs')showD();if(t=='visits')showV();if(t=='rx')showRx();if(t=='hosp')showH();if(t=='req')showQ();if(t=='me')fillMe();
  window.scrollTo(0,0);
}

function showD(){
  const q=$('q').value.toLowerCase(),sp=$('sp').value,ct=$('ct').value;
  const r=D.map((d,i)=>({...d,i})).filter(d=>(!sp||d.specialty==sp)&&(!ct||d.city==ct)&&(d.name+d.specialty+d.city+d.languages).toLowerCase().includes(q));
  $('dl').innerHTML=r.length?r.map(d=>'<div class="card"><div class="name">'+esc(d.name)+'</div><div class="info">'+esc(d.specialty)+' • '+esc(d.city)+'</div><div class="info">'+d.experience+' years • Speaks '+esc(d.languages)+'</div><div class="info">'+esc(d.clinic)+'</div><div class="fee">K'+d.fee+' per visit</div><div class="row"><button onclick="book('+d.i+')">Book</button></div></div>').join(''):'<p class="empty">No doctors match your criteria.</p>';
}

function book(i){
  sel=i;$('ft').textContent='Book '+D[i].name;$('pn').value=me.name;$('ph').value=me.phone;
  $('dt').min=today();$('form').style.display='block';mm();window.scrollTo(0,0);
}

function mm(){
  const c=$('pm').value=='Pay at clinic';$('mo').style.display=c?'none':'block';
  $('cb').textContent=c?'Request booking':'Request and pay K'+D[sel].fee;
}

async function confirmB(){
  const n=$('pn').value.trim(),p=$('ph').value.trim(),dt=$('dt').value,tm=$('tm').value,m=$('pm').value,mo=$('mo').value.trim();
  if(!n||!p||!dt){alert('Enter your name, phone and date.');return}
  if(dt<today()){alert('Pick today or a later date.');return}
  let paid=false;
  if(m!='Pay at clinic'){
    if(!mo){alert('Enter your mobile money number.');return}
    paid=true;
  }

  const { error } = await sb.from('appointments').insert([{
    doctor_id: D[sel].id,
    patient_name: n,
    patient_phone: p,
    appointment_date: dt,
    appointment_time: tm,
    payment_method: m,
    is_paid: paid,
    fee: D[sel].fee,
    status: 'Pending'
  }]);

  if(error){ alert('Booking failed: '+error.message); return; }
  
  if(!me.name){me.name=n;me.phone=p;S('me',me)}
  $('form').style.display='none';
  alert('Request sent live to database!');
  go('visits');
}

async function showV(){
  if(!me.phone){
    $('vl').innerHTML='<p class="empty">Please set your phone number in the "Me" tab to view visits.</p>';
    return;
  }
  const { data, error } = await sb.from('appointments').select('*, doctors(name)').eq('patient_phone', me.phone);
  if(error || !data || !data.length){
    $('vl').innerHTML='<p class="empty">No visits booked yet for phone: '+esc(me.phone)+'</p>';
    return;
  }
  $('vl').innerHTML=data.map(a=>'<div class="card"><div class="name">'+esc(a.doctors?a.doctors.name:'Doctor')+'</div><div class="info">'+a.appointment_date+' at '+a.appointment_time+'</div><div class="info">'+(a.is_paid?'Paid K'+a.fee+' via '+a.payment_method:'Pay K'+a.fee+' at clinic')+'</div><div class="'+(a.status=='Pending'?'warn':'info')+'">Status: '+esc(a.status)+'</div></div>').join('');
}

async function showQ(){
  const docId = D[me.did]?.id;
  if(!docId){ $('rq').innerHTML='<p class="empty">Doctor not selected.</p>'; return; }
  const { data, error } = await sb.from('appointments').select('*').eq('doctor_id', docId);
  $('rq').innerHTML=(data && data.length)?data.map(a=>'<div class="card"><div class="name">'+esc(a.patient_name)+'</div><div class="info">Phone: '+esc(a.patient_phone)+'</div><div class="info">'+a.appointment_date+' at '+a.appointment_time+'</div><div class="warn">Status: '+esc(a.status)+'</div></div>').join(''):'<p class="empty">No booking requests found.</p>';
}

function showRx(){
  $('rl').innerHTML=RX.map((x,i)=>'<div class="card"><div class="name">'+x[0]+'</div><div class="fee">K'+x[1]+'</div><button onclick="add('+i+',1)">Add to cart</button></div>').join('');
  const k=Object.keys(cart).filter(i=>cart[i]>0);let tot=0;
  $('cl').innerHTML=k.length?k.map(i=>{tot+=RX[i][1]*cart[i];return '<div class="card"><div class="info">'+RX[i][0]+' × '+cart[i]+'</div><button class="g" onclick="add('+i+',-1)">Remove</button></div>'}).join('')+'<div class="fee">Total: K'+tot+'</div>':'<p class="empty">Your cart is empty.</p>';
}
function add(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);S('cart',cart);showRx()}

function showH(){
  const p=$('prov').value;const r=H.filter(h=>!p||h[2]==p);
  $('hl').innerHTML=r.length?r.map(h=>'<div class="card"><div class="name">'+h[0]+'</div><div class="info">'+h[3]+' • '+h[1]+', '+h[2]+' Province</div></div>').join(''):'<p class="empty">No listings found.</p>';
}
function near(){
  const p=$('prov').value,d=$('dist').value.trim(),pl=d||(p?CAP[p]:'');
  if(!pl){alert('Choose a province or district.');return}
  window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('hospitals in '+pl+', Zambia'),'_blank');
}

function fillMe(){$('mn').value=me.name;$('mp').value=me.phone;$('role').value=me.role;$('did').value=me.did;roleUI()}
function roleUI(){const v=$('role').value=='doctor'?'block':'none';$('did').style.display=v}
function saveMe(){
  me={name:$('mn').value.trim(),phone:$('mp').value.trim(),role:$('role').value,did:+$('did').value};
  S('me',me);nav();go(me.role=='doctor'?'req':'docs');
}
function clearAll(){localStorage.clear();location.reload()}
function sos(){const p=$('sp2');p.style.display=p.style.display=='block'?'none':'block'}

$('q').addEventListener('input',showD);$('sp').onchange=showD;$('ct').onchange=showD;
init();
</script>
</body></html>
